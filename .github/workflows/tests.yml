name: tests
on:
push:
workflow_dispatch:
jobs:
e2e:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-dotnet@v4
with:
dotnet-version: '8.0.407'
- run: dotnet build E2ETests
- run: pwsh E2ETests/bin/Debug/net8.0/playwright.ps1 install --with-
deps
- run: dotnet test E2ETests --no-build
load:
runs-on: ubuntu-latest
needs: e2e
steps:
- uses: actions/checkout@v4
- run: docker run --rm -i grafana/k6 run - < load/smoke.js